<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;circle cx='50' cy='50' r='50' fill='green'/&gt;&lt;/svg&gt;">
  
  <!-- Primary Meta Tags -->
  <title>Prem Malik — Live Projects & Digital Products</title>
  <meta name="title" content="Prem Malik — Live Projects & Digital Products" />
  <meta name="description" content="Explore live web tools, utilities, and digital products built by Prem Malik. Production-grade projects in encryption, finance, and productivity." />
  <meta name="keywords" content="Prem Malik, Web Tools, Live Projects, Digital Products, Encryption Tool, Expense Calculator, Image Editor" />
  <meta name="author" content="Prem Malik" />
  <link rel="canonical" href="https://premmalik.in/static/index.html" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://premmalik.in/static/index.html" />
  <meta property="og:title" content="Prem Malik — Live Projects & Digital Products" />
  <meta property="og:description" content="Explore live web tools, utilities, and digital products built by Prem Malik." />
  <meta property="og:image" content="https://premmalik.in/static/img/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://premmalik.in/static/index.html" />
  <meta property="twitter:title" content="Prem Malik — Live Projects & Digital Products" />
  <meta property="twitter:description" content="Explore live web tools, utilities, and digital products built by Prem Malik." />
  <meta property="twitter:image" content="https://premmalik.in/static/img/og-image.jpg" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Prem Malik — Live Projects",
    "description": "A collection of live web tools and products built by Prem Malik.",
    "publisher": {
      "@type": "Person",
      "name": "Prem Malik"
    }
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">

  <style>
    /* ——— Design Tokens ——— */
    :root {
      --bg-deep: #08090c;
      --bg-surface: #0e1014;
      --bg-card: #13161c;
      --bg-card-hover: #191d25;
      --accent: #c8a45e;
      --accent-light: #e4cb86;
      --accent-glow: rgba(200, 164, 94, 0.25);
      --accent-subtle: rgba(200, 164, 94, 0.08);
      --mint: #5ee6b8;
      --coral: #f07068;
      --text-primary: #f0ece4;
      --text-secondary: #8a8680;
      --text-tertiary: #5a5650;
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(200, 164, 94, 0.3);
      --radius: 14px;
      --radius-sm: 8px;
      --radius-pill: 100px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-out: cubic-bezier(0, 0, 0.2, 1);
    }

    /* ——— Reset ——— */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* ——— Body & Grain Overlay ——— */
    body {
      background: var(--bg-deep);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ——— Ambient Glow Blobs ——— */
    .ambient {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    .ambient--gold {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(200,164,94,0.08) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .ambient--teal {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(94,230,184,0.05) 0%, transparent 70%);
      bottom: 20%; left: -80px;
    }

    /* ——— Layout ——— */
    .page-wrapper {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* ——— Navigation ——— */
    

    /* ——— Hero ——— */
    .hero {
      padding: 100px 0 80px;
      text-align: center;
      position: relative;
    }
    
    .hero h1 {
      font-family: var(--font-display);
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.08;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease) 0.35s forwards;
    }
    .hero h1 .em {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 50%, var(--mint) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-secondary);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.7;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease) 0.5s forwards;
    }

    /* ——— Stats Row ——— */
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 48px;
      opacity: 0;
      animation: fadeUp 0.8s var(--ease) 0.65s forwards;
    }
    .stat {
      text-align: center;
    }
    .stat-value {
      font-family: var(--font-display);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
    }
    .stat-label {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      margin-top: 6px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* ——— Divider ——— */
    .section-divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--border), rgba(200,164,94,0.15), var(--border), transparent);
      margin: 0;
    }

    /* ——— Controls ——— */
    .controls-section {
      padding: 40px 0 12px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }
    .search-wrap {
      position: relative;
      min-width: 260px;
      flex: 1;
      max-width: 360px;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 16px 11px 42px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.88rem;
      transition: border-color 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .search-wrap input::placeholder {
      color: var(--text-tertiary);
    }
    .search-wrap input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pill {
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s var(--ease);
      white-space: nowrap;
    }
    .pill:hover {
      border-color: rgba(255,255,255,0.12);
      color: var(--text-primary);
      background: rgba(255,255,255,0.03);
    }
    .pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg-deep);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* ——— Project Grid ——— */
    .grid-section {
      padding: 36px 0 80px;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ——— Card ——— */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 26px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: transform 0.45s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease), background 0.4s var(--ease);
      opacity: 0;
      animation: cardReveal 0.6s var(--ease) forwards;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-subtle) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.4s var(--ease);
      pointer-events: none;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      box-shadow:
        0 20px 60px rgba(0,0,0,0.35),
        0 0 0 1px rgba(200,164,94,0.1);
    }
    .card:hover::before {
      opacity: 1;
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .card-badge {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }
    .card-badge--free {
      background: rgba(94, 230, 184, 0.1);
      color: var(--mint);
      border: 1px solid rgba(94, 230, 184, 0.15);
    }
    .card-badge--paid {
      background: rgba(200, 164, 94, 0.1);
      color: var(--accent-light);
      border: 1px solid rgba(200, 164, 94, 0.15);
    }
    .card-badge--membership {
      background: rgba(240, 112, 104, 0.1);
      color: var(--coral);
      border: 1px solid rgba(240, 112, 104, 0.15);
    }
    .card-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: var(--mint);
      font-weight: 500;
    }
    .card-status .dot {
      width: 6px;
      height: 6px;
      background: var(--mint);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    .card-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .card-desc {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }
    .card-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 22px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--bg-deep);
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), gap 0.3s var(--ease);
    }
    .card-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--accent-glow);
      gap: 12px;
    }
    .card-btn svg {
      width: 14px;
      height: 14px;
      transition: transform 0.3s var(--ease);
    }
    .card-btn:hover svg {
      transform: translateX(2px);
    }

    /* ——— No Results ——— */
    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-tertiary);
      font-size: 1rem;
    }
    .no-results span {
      display: block;
      font-size: 2rem;
      margin-bottom: 12px;
    }

    /* ——— Footer ——— */
    .site-footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 32px 0;
    }
    .site-footer .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .footer-left {
      font-size: 0.82rem;
      color: var(--text-tertiary);
    }
    .footer-left a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer-right {
      font-size: 0.78rem;
      color: var(--text-tertiary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* ——— Animations ——— */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    /* ——— Responsive ——— */
    @media (max-width: 768px) {
      .hero { padding: 72px 0 56px; }
      .hero h1 { font-size: 2.2rem; }
      .stats-row { gap: 28px; }
      .stat-value { font-size: 1.4rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: 100%; }
      .filter-pills { justify-content: flex-start; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
      .filter-pills::-webkit-scrollbar { display: none; }
      .project-grid { grid-template-columns: 1fr; }
      .topbar-links { display: none; }
    }
    @media (max-width: 400px) {
      .hero h1 { font-size: 1.8rem; }
      .card { padding: 22px 18px 20px; }
      .stats-row { flex-wrap: wrap; gap: 20px; }
    }
  </style>
</head>
<body>

  <!-- Ambient Light -->
  <div class="ambient ambient--gold" aria-hidden="true"></div>
  <div class="ambient ambient--teal" aria-hidden="true"></div>

  <div class="page-wrapper">

    <!-- ——— Top Bar ——— -->
    

    <!-- ——— Hero ——— -->
    <header class="hero">
      <div class="container">
        
        <h1>I Build Things That<br/><span class="em">Actually Ship.</span></h1>
        <p class="hero-sub">Real tools, real products for real users. Every project here is live, functional, and built to solve a genuine problem. Browse and try them out.</p>

        <div class="stats-row">
          <div class="stat">
            <div class="stat-value" id="statProjects">7</div>
            <div class="stat-label">Live Projects</div>
          </div>
          <div class="stat">
            <div class="stat-value">100%</div>
            <div class="stat-label">Functional</div>
          </div>
          <div class="stat">
            <div class="stat-value">2026</div>
            <div class="stat-label">Active</div>
          </div>
        </div>
      </div>
    </header>

    <div class="section-divider"></div>

    <!-- ——— Controls ——— -->
    <section class="controls-section">
      <div class="container">
        <div class="controls">
          <div class="search-wrap">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input type="text" id="searchInput" placeholder="Search projects..." aria-label="Search projects" />
          </div>
          <div class="filter-pills" id="filterGroup">
            <button class="pill active" data-filter="all">All Projects</button>
            <button class="pill" data-filter="free">Free</button>
            <button class="pill" data-filter="paid">Paid (One-time)</button>
            <button class="pill" data-filter="membership">Membership</button>
          </div>
        </div>
      </div>
    </section>

    <!-- ——— Grid ——— -->
    <main class="grid-section">
      <div class="container">
        <section class="project-grid" id="projectGrid" aria-label="Projects"></section>
      </div>
    </main>

    <!-- ——— Footer ——— -->
    <footer class="site-footer">
      <div class="container">
        <div class="footer-left">&copy; 2026 <a href="/">Prem Malik</a></div>
        <div class="footer-right">premmalik.in</div>
      </div>
    </footer>

  </div>

  <script>
    /* ——————————————————————————————
       Project Data
    —————————————————————————————— */
    const projects = [
      {
        id: 1,
        title: "GreenBox 256-bit Encryption",
        url: "greenbox.html",
        desc: "Military-grade encryption tool that protects your sensitive data with 256-bit AES. One-time purchase, lifetime protection.",
        category: "free",
        status: "live"
      },
      {
        id: 10,
        title: "SplitWise — Mobile",
        url: "splitwise-phone.html",
        desc: "Split costs instantly among friends. Works offline with local browser storage — no account needed.",
        category: "free",
        status: "live"
      },
      {
        id: 11,
        title: "Ledger Maker — Desktop",
        url: "splitwise-desktop.html",
        desc: "Full-featured desktop ledger for tracking shared expenses with detailed breakdowns and export options.",
        category: "free",
        status: "live"
      },
      {
        id: 12,
        title: "Markdown → Clean HTML",
        url: "md-text.html",
        desc: "Paste raw LLM output in Markdown, get clean printable HTML. Perfect for documentation and reports.",
        category: "free",
        status: "live"
      },
      {
        id: 13,
        title: "GreenBox — Desktop Client",
        url: "https://019c9e44-0d37-7ae8-9bc2-561e6d376f8b.arena.site/",
        desc: "The desktop companion for GreenBox encryption. Drag-and-drop file protection with a polished interface.",
        category: "free",
        status: "live"
      },
      {
        id: 14,
        title: "Image Resizer Pro",
        url: "imageEdit.html",
        desc: "Resize, crop, and optimize images directly in the browser. No uploads, no accounts — completely private.",
        category: "free",
        status: "live"
      },
      {
        id: 15,
        title: "Quick Image Editor",
        url: "imgEditer.html",
        desc: "Lightweight browser-based image editor. Works offline and handles all common editing tasks.",
        category: "free",
        status: "live"
      }
    ];

    /* ——————————————————————————————
       DOM References
    —————————————————————————————— */
    const gridEl = document.getElementById('projectGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.pill');

    /* ——————————————————————————————
       Badge Class Map
    —————————————————————————————— */
    const badgeMap = {
      free: { cls: 'card-badge--free', label: 'Free' },
      paid: { cls: 'card-badge--paid', label: 'Paid · One-time' },
      membership: { cls: 'card-badge--membership', label: 'Membership' }
    };

    /* ——————————————————————————————
       Render
    —————————————————————————————— */
    function renderProjects(filter = 'all', searchTerm = '') {
      gridEl.innerHTML = '';
      const query = searchTerm.toLowerCase().trim();

      const filtered = projects.filter(p => {
        const matchCat = filter === 'all' || p.category === filter;
        const matchSearch = p.title.toLowerCase().includes(query) ||
                            p.desc.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="no-results"><span>∅</span>No projects found matching "${searchTerm}".</div>`;
        return;
      }

      filtered.forEach((p, i) => {
        const badge = badgeMap[p.category] || badgeMap.free;
        const card = document.createElement('article');
        card.className = 'card';
        card.style.animationDelay = `${i * 0.08}s`;

        card.innerHTML = `
          <div class="card-top">
            <span class="card-badge ${badge.cls}">${badge.label}</span>
            <span class="card-status"><span class="dot"></span>${p.status === 'live' ? 'Live' : 'In Dev'}</span>
          </div>
          <h2 class="card-title">${p.title}</h2>
          <p class="card-desc">${p.desc}</p>
          <div class="card-footer">
            <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="card-btn">
              Open Project
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path>
              </svg>
            </a>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    /* ——————————————————————————————
       Event Listeners
    —————————————————————————————— */
    searchInput.addEventListener('input', (e) => {
      const activeFilter = document.querySelector('.pill.active').dataset.filter;
      renderProjects(activeFilter, e.target.value);
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderProjects(btn.dataset.filter, searchInput.value);
      });
    });

    /* Initial render */
    renderProjects();
  </script>
</body>
</html>
